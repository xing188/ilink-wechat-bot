spring:
  profiles:
    include: ai,database,thirdparty

app:
  ilink:
    enabled: true
    poll-interval-ms: 1000
  reminder:
    dispatch-interval-ms: 10000
    zone: Asia/Shanghai
  chat:
    system-prompt: "You are a concise and accurate assistant. Reply in Chinese."

server:
  port: 9090

logging:
  level:
    com.ilink.test.ilinkcheck.application.conversation.ConversationAiService: DEBUG