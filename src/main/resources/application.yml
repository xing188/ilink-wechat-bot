spring:
  ai:
    openai:
      api-key: ${ALIYUN_API_KEY}
      base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      chat:
        model: "qwen3.7-plus"
        temperature: 0.7
        max-tokens: 4096
    dashscope:
      api-key: ${ALIYUN_API_KEY}

  data:
    redis:
      host: ${REDIS_HOST:223.109.143.141}
      port: ${REDIS_PORT:6379}
      password: ${PASSWORD:}
      database: 0

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:223.109.143.141}:${MYSQL_PORT:3306}/ilink_clawbot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${PASSWORD:}

app:
  ilink:
    enabled: true
    poll-interval-ms: 1000
  reminder:
    dispatch-interval-ms: 10000
    zone: Asia/Shanghai
  chat:
    system-prompt: "You are a concise and accurate assistant. Reply in Chinese."
  tts:
    model: "cosyvoice-v3-flash"
    voice: "longanyang"
    sample-rate: 24000
    speed: 1.0
server:
  port: 9090
