spring:
  ai:
    openai:
      api-key: ${ALIYUN_API_KEY}
      base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      chat:
        model: "qwen3.7-plus"
        temperature: 0.7
        max-tokens: 4096
      embedding:
        enabled: false
    dashscope:
      api-key: ${ALIYUN_API_KEY}

app:
  tts:
    model: "cosyvoice-v3-flash"
    voice: "longanyang"
    sample-rate: 24000
    speed: 1.0
