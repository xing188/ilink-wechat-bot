app:
  tianapi:
    key: ${TIANAPI_KEY:""}
  search:
    serpapi-key: ${SERPAPI_API_KEY:""}
  book:
    douban-api-key: REPLACE_WITH_DOUBANAPI_KEY
  github:
    enabled: true
    api-base: "https://api.github.com"
    token: ${GITHUB_TOKEN:}
    trending-api-url: "https://cloudflare-mcp1.zx1993.top/api"
    trending-path: "/trending"
    # 兼容 Steam++ 这类本地 TLS 代理签发的证书，否则 Java 会拒绝访问被 hosts 劫持的 GitHub 域名。
    trust-local-ca: true
  digest:
    zone: "Asia/Shanghai"
    github:
      language: "java"
      since: "weekly"
      limit: 5
    devto:
      tag: "ai"
      limit: 0
