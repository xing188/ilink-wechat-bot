<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iLink WeChat Bot</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/qrcode.min.js"></script>
    <script src="/js/three.min.js"></script>
</head>
<body>
    <div id="three-container"></div>

    <div class="login-card">
        <div class="card-header">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="8" opacity="0.3"/>
                    <circle cx="12" cy="12" r="3"/>
                    <circle cx="18" cy="6" r="1.5"/>
                    <circle cx="6" cy="18" r="1"/>
                    <circle cx="20" cy="16" r="0.8"/>
                    <circle cx="8" cy="5" r="1.2"/>
                </svg>
            </div>
            <h1>iLink WeChat Bot</h1>
            <p class="subtitle">扫码登录 · 连接微信</p>
        </div>

        <div class="qr-section">
            <div class="qr-wrapper">
                <div id="qrcode"></div>
                <div class="qr-overlay" id="qrOverlay">
                    <div class="qr-overlay-icon">
                        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" id="statusIcon">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                            <polyline points="22 4 12 14.01 9 11.01"/>
                        </svg>
                    </div>
                    <span class="qr-overlay-text" id="statusText">等待扫码</span>
                </div>
            </div>
        </div>

        <div class="status-bar" id="statusBar">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusLabel">等待微信扫码...</span>
        </div>

        <div class="card-footer">
            <span class="hint-text">打开微信「扫一扫」登录</span>
            <a href="/review.html" class="hint-text workbench-link" style="color:#22d3ee;text-decoration:none;font-size:12px;">审稿工作台 →</a>
            <a href="/monitor.html" class="hint-text workbench-link" style="color:#a78bfa;text-decoration:none;font-size:12px;">Agent 监控台 →</a>
            <div class="particles-decoration">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    </div>

    <script src="/js/qrLogin.js"></script>
</body>
</html>
