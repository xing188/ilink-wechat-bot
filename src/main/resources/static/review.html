<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>审稿工作台 · Doc Review Console</title>
    <link rel="stylesheet" href="/css/review.css">
</head>
<body>
    <div class="bg-decoration" aria-hidden="true"></div>

    <header class="topbar">
        <div class="brand">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M9 12h6"/><path d="M12 9v6"/>
                    <rect x="3.5" y="3.5" width="17" height="17" rx="4"/>
                </svg>
            </div>
            <div>
                <h1>审稿工作台</h1>
                <span class="brand-sub">Doc Review Console · 技术文档规范审稿</span>
            </div>
        </div>
        <a class="back-link" href="/">← 返回登录页</a>
    </header>

    <main class="workspace">
        <!-- 左侧：草稿输入 -->
        <section class="panel input-panel">
            <div class="panel-head">
                <h2>待审草稿</h2>
                <div class="head-actions">
                    <button class="ghost-btn" id="sampleBtn" type="button">填入样例</button>
                    <button class="ghost-btn" id="clearBtn" type="button">清空</button>
                    <span class="char-count" id="charCount">0</span>
                </div>
            </div>
            <textarea id="draftInput" spellcheck="false"
                      placeholder="粘贴你的技术文档 / 博客草稿，支持 Markdown…"></textarea>
            <div class="input-foot">
                <span class="hint">检查：中英文空格 · 中文数字空格 · 代码块语言 · 术语大小写</span>
                <button class="primary-btn" id="reviewBtn" type="button">
                    <span class="btn-label">开始审稿</span>
                </button>
            </div>
        </section>

        <!-- 右侧：结果区 -->
        <section class="panel result-panel">
            <div class="result-tabs">
                <button class="tab active" data-tab="report" type="button">审稿报告</button>
                <button class="tab" data-tab="diff" type="button" disabled>修改稿 Diff</button>
                <div class="tab-spacer"></div>
                <button class="ghost-btn hidden" id="copyFixBtn" type="button">复制修改稿</button>
                <button class="ghost-btn hidden" id="exportBtn" type="button">导出报告 .docx</button>
            </div>

            <div class="result-body" id="resultBody">
                <div class="empty-state">
                    <div class="empty-icon">
                        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4">
                            <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
                            <path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/>
                            <path d="M12 11v6"/><path d="M9 14h6"/>
                        </svg>
                    </div>
                    <p>在左侧粘贴草稿，点击「开始审稿」查看规范问题与修改建议</p>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/review.js"></script>
</body>
</html>
