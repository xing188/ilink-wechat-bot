<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent 运行监控台 · Agent Monitor</title>
    <link rel="stylesheet" href="/css/monitor.css">
</head>
<body>
    <div class="bg-decoration" aria-hidden="true"></div>

    <header class="topbar">
        <div class="brand">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6">
                    <path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4"/>
                    <circle cx="12" cy="12" r="3.5"/>
                </svg>
            </div>
            <div>
                <h1>Agent 运行监控台</h1>
                <span class="brand-sub">Agent Runtime Monitor · 状态机实时流转</span>
            </div>
        </div>
        <div class="top-actions">
            <div class="conn" id="connBox">
                <span class="conn-dot" id="connDot"></span>
                <span id="connText">连接中…</span>
            </div>
            <button class="ghost-btn" id="clearBtn" type="button">清空</button>
            <a class="back-link" href="/">← 返回登录页</a>
        </div>
    </header>

    <section class="stats-bar">
        <div class="stat"><b id="convCount">0</b><span>在线会话</span></div>
        <div class="stat"><b id="eventCount">0</b><span>事件总数</span></div>
        <div class="stat"><b id="runCount">0</b><span>运行中</span></div>
        <div class="stat"><b id="waitCount">0</b><span>等待输入</span></div>
        <div class="stat"><b id="doneCount">0</b><span>已完成</span></div>
    </section>

    <main class="conv-list" id="convList">
        <div class="empty-state">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
            </div>
            <p>等待 Agent 工作流事件…<br>去微信发一条触发 Agent 的消息（速读 / 路线 / 审稿 / 晨报），这里会实时显示状态机流转</p>
        </div>
    </main>

    <script src="/js/monitor.js"></script>
</body>
</html>
