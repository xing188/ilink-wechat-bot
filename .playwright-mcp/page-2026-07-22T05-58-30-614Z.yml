            - paragraph [ref=e82]: 功能概述
            - paragraph [ref=e83]: 这个接口支持三种查询方式：
            - paragraph [ref=e84]: "- 可以传 adcode，按行政区编码查询（优先级最高）"
            - paragraph [ref=e85]: "- 可以传 city，按城市名称查询，支持中文（北京）和英文（Tokyo）"
            - paragraph [ref=e86]: "- 两个都不传时，按客户端 IP 自动定位查询"
            - paragraph [ref=e87]: 支持 lang 参数，可选 zh（默认）和 en，城市名翻译覆盖 7000+ 城市。
            - paragraph [ref=e88]: 可选功能模块
            - paragraph [ref=e89]: "- extended=true：扩展气象字段（体感温度、能见度、气压、紫外线、空气质量及污染物分项数据）"
            - paragraph [ref=e90]: "- forecast=true：多天预报（最多7天，会额外返回每天的最高温度、最低温度，以及日出日落、风速等详细数据）"
            - paragraph [ref=e91]: "- hourly=true：逐小时预报（24小时）"
            - paragraph [ref=e92]: "- minutely=true：分钟级降水预报（仅国内城市，精确到2分钟）"
            - paragraph [ref=e93]: "- indices=true：18项生活指数（穿衣、紫外线、洗车、运动、花粉等）"
            - paragraph [ref=e94]: 天气字段说明
            - paragraph [ref=e95]: weather 是天气现象文本，不是固定枚举。
            - paragraph [ref=e96]: 常见值包括：晴、多云、阴、小雨、中雨、大雨、雷阵雨、小雪、中雪、大雪、雨夹雪、雾、霾、沙尘。
            - paragraph [ref=e97]: 如果你的业务需要稳定的天气分类，建议使用 weathercode 进行映射。完整的天气图标代码请参考天气图标代码表。
