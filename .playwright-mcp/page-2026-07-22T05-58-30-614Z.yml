          - heading [level=1] [ref=e75]: 查询天气
          - paragraph [ref=e76]: 完全免费的天气查询API接口，无需注册即可调用！支持国内和国际城市，实时获取天气预报数据，支持按城市名称（中英文）或Adcode查询，未传参数时自动IP定位。返回温度、湿度、风向、风力等完整气象信息，可选扩展字段（体感温度、能见度、气压、紫外线、空气质量及污染物分项）、18项生活指数、最多7天天气预报、逐小时预报（24小时）和分钟级降水预报。JSON格式响应，毫秒级响应速度。适用于天气应用、出行规划、智能家居、农业监测等场景。 · 适用于天气预报应用、出行规划工具、智能家居系统、农业气象监测、物流配送调度、户外活动提醒、旅游APP、小程序天气功能等场景 · 查询天气
