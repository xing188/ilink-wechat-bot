          - generic [ref=e541]:
            - heading "常见问题解答" [level=2] [ref=e543]
            - generic [ref=e544]:
              - generic [ref=e545]:
                - heading "这个天气API是免费的吗？" [level=3] [ref=e549] [cursor=pointer]
                - paragraph [ref=e554]: 是的，这个API完全免费，无需注册或API密钥，可以直接调用。适合个人和商业项目使用。
              - generic [ref=e555]:
                - heading "支持查询哪些城市的天气？" [level=3] [ref=e559] [cursor=pointer]
                - paragraph [ref=e564]: 支持国内和国际城市。国内覆盖3000+城市（省、市、区县级别），国际城市也广泛支持。可以通过中文或英文城市名称、Adcode查询。
              - generic [ref=e565]:
                - heading "不传 city 或 adcode 可以吗？" [level=3] [ref=e569] [cursor=pointer]
                - paragraph [ref=e574]: 可以。不传参数时会自动根据客户端 IP 定位后查询天气。如果自动定位失败，建议手动传 city 或 adcode。
              - generic [ref=e575]:
                - heading "如何获取城市的Adcode？" [level=3] [ref=e579] [cursor=pointer]
                - paragraph [ref=e584]: Adcode是城市行政区划代码，例如北京市是110000。你可以直接使用城市名称查询，或者搜索'中国行政区划代码'获取Adcode。
              - generic [ref=e585]:
                - heading "天气数据多久更新一次？" [level=3] [ref=e589] [cursor=pointer]
                - paragraph [ref=e594]: 天气数据实时获取，每次调用都会返回最新的气象信息，数据来源于权威气象服务。
              - generic [ref=e595]:
                - heading "返回的数据包含哪些信息？" [level=3] [ref=e599] [cursor=pointer]
                - paragraph [ref=e604]: 基础数据包括：天气现象、温度、湿度、风向、风力、更新时间。通过 extended=true 可获取体感温度、能见度、气压、紫外线、空气质量及污染物分项数据。通过 forecast=true 可获取最多7天天气预报，并返回每天的最高温度、最低温度、日出日落等详细数据。通过 hourly=true 可获取逐小时预报（24小时）。通过 minutely=true 可获取精确到2分钟的分钟级降水预报（仅国内）。通过 indices=true 可获取18项生活指数。
              - generic [ref=e605]:
                - heading "逐小时预报和分钟级降水有什么区别？" [level=3] [ref=e609] [cursor=pointer]
                - paragraph [ref=e614]: 逐小时预报（hourly）返回未来24小时每小时的温度、天气、风向等完整气象数据。分钟级降水（minutely）返回精确到2分钟的降水量和降水类型，适合精确判断短期内是否会下雨。分钟级降水仅国内城市可用。
              - generic [ref=e615]:
                - heading "生活指数包含哪些内容？" [level=3] [ref=e619] [cursor=pointer]
                - paragraph [ref=e624]: 共18项：穿衣、紫外线、洗车、晾晒、空调开启、感冒、运动、舒适度、出行、钓鱼、过敏、防晒、心情、啤酒、雨伞、交通、空气净化器、花粉扩散。每项包含等级、简短描述和详细建议。所有城市均可用，基于当前气象数据实时计算。
              - generic [ref=e625]:
                - heading "lang=en 时哪些字段会翻译？" [level=3] [ref=e629] [cursor=pointer]
                - paragraph [ref=e634]: 城市名、省份、天气描述、风向、风力、星期等文本字段都会自动翻译为英文，城市名翻译覆盖7000+城市。生活指数（indices）目前仅支持中文。
              - generic [ref=e635]:
                - heading "为什么有些字段没有返回？" [level=3] [ref=e639] [cursor=pointer]
                - paragraph [ref=e644]: 部分可选字段取决于数据源覆盖情况。国际城市通常字段更完整，国内城市部分字段可能缺失。extended=false（默认）时不返回任何扩展字段。
